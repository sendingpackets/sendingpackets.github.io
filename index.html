<script>
(function () {
  const mobileByUserAgent = /Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  const mobileByPointer = window.matchMedia("(pointer: coarse)").matches &&
    window.matchMedia("(max-width: 900px)").matches;

  if (!mobileByUserAgent && !mobileByPointer) return;

  let charIndex = 0;

  function mobileWord(word) {
    const letters = Array.from(word, (letter) => {
      const index = charIndex++;
      return '<span class="char" style="--i:' + index + '">' + letter + '</span>';
    }).join("");

    charIndex++;
    return '<span class="mobile-word">' + letters + '</span>';
  }

  const message =
    mobileWord("Mobile") + " " + mobileWord("is") + " " + mobileWord("not") + " " + mobileWord("supported.") +
    "<br>" +
    mobileWord("Please") + " " + mobileWord("view") + " " + mobileWord("on") + " " + mobileWord("desktop.");

  const html =
    '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">' +
    '<meta name="robots" content="noindex, nofollow"><title>terrorism.cc</title>' +
    '<style>html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:"Mongolian Baiti",serif}body{display:flex;align-items:center;justify-content:center;color:#8a0b04;font-size:clamp(16px,min(4.9vw,2.8vh),28px);line-height:1.22;text-align:center;filter:blur(.35px) contrast(1.35) saturate(1.25);padding:0 16px;box-sizing:border-box;text-shadow:0 0 2px #8a0b04,0 0 7px #8a0b04,0 0 18px #8a0b04,0 0 32px #550400}.mobile-message{width:min(100%,max-content);max-width:calc(100vw - 32px);text-wrap:balance;white-space:normal}.mobile-word{display:inline-block;white-space:nowrap}.char{display:inline-block;animation:noodleWave 8.12s ease-in-out infinite;animation-delay:calc(var(--i) * -.18s);transform-origin:50% 70%;will-change:transform}@media (max-width:420px),(max-height:740px){body{font-size:clamp(14px,min(4.35vw,2.45vh),24px);padding:0 12px}.mobile-message{max-width:calc(100vw - 24px)}}@media (max-width:340px),(max-height:620px){body{font-size:clamp(12px,min(3.9vw,2.15vh),20px);line-height:1.18}}@keyframes noodleWave{0%,100%{transform:translateY(0) rotate(0deg) skewX(0deg)}20%{transform:translateY(-1.2px) rotate(-1.8deg) skewX(3deg)}45%{transform:translateY(.9px) rotate(1.4deg) skewX(-2.5deg)}70%{transform:translateY(-.6px) rotate(1deg) skewX(1.8deg)}}</style></head>' +
    '<body><div class="mobile-message">' + message + '</div></body></html>';

  document.open();
  document.write(html);
  document.close();
  throw new Error("__mobile_blocked__");
})();
</script>

<body class="enter-locked">
  <noscript><div class="noscript-screen">JavaScript is required to view this page.</div></noscript>
  <div class="stage">
    <div class="stage-image-stack" aria-hidden="true">
      <img class="stage-image stage-image--anchor active" data-key="qq" alt="" draggable="false" data-src="/assets/misc/qq1thNUeMejImuIpKF.png" />
      <img class="stage-image" data-key="zU" alt="" draggable="false" data-src="/assets/misc/zUeUe104mwKQm5deq9.png" />
      <img class="stage-image" data-key="ed" alt="" draggable="false" data-src="/assets/misc/ed3xCGxiXwK6Ri0tcY.png" />
    </div>
  </div>

  <div class="lamp" aria-hidden="true">
    <img class="lamp-off" alt="" draggable="false" data-src="/assets/misc/f2m6BPaNuZgZ23sE30.png" />
    <img class="lamp-on"  alt="" draggable="false" data-src="/assets/misc/ej4KEaHQhygLVwFbfn.png" />
  </div>

  <div class="enter-screen" id="enter-screen" aria-label="Open page">
    <div class="enter-message">Click on me to open this page.</div>
  </div>

  <div class="handle" id="handle"><span class="text default">kunt was here</span><span class="text hover">my discord</span></div>
  <div class="music-progress" aria-hidden="true"><div class="music-progress-fill" id="music-progress-fill"></div></div>
  <audio id="ambient-audio" src="/assets/misc/g47Fe6Wf73yeblhRHh.mp3" preload="auto" loop></audio>
  <audio id="crying-audio" src="/assets/misc/pzR6g15fW8bfKCr3Ph.mp3" preload="auto" loop></audio>

<script>
  const handle = document.getElementById('handle');
  const enterScreen = document.getElementById('enter-screen');
  const ambientAudio = document.getElementById('ambient-audio');
  const cryingAudio = document.getElementById('crying-audio');
  const musicProgressFill = document.getElementById('music-progress-fill');
  const DISCORD_USER = 'sendingpackets';
  const INTRO_STING_KEY = 'mOco7LWe9juQE8TJJD';
  const INTRO_STING_VALUE = '1';
  const INTRO_STINGS = [
    '/assets/misc/z0G43VOqMeyhgWQNqN.wav',
    '/assets/misc/HyKy5mTB2eD69eaIdH.wav'
  ];
  const STAGE_VARIANTS = {
    qq: '/assets/misc/qq1thNUeMejImuIpKF.png',
    zU: '/assets/misc/zUeUe104mwKQm5deq9.png',
    ed: '/assets/misc/ed3xCGxiXwK6Ri0tcY.png'
  };
  const STAGE_SEQUENCE = ['zU', 'ed', 'zU', 'qq'];
  const FLICKER_SOUND_SRC = '/assets/misc/vBlOJLnS6H9O3qk3Kz.mp3';
  let lastAudioTime = 0;
  let audioCycleCount = 0;
  let progressRaf = null;
  let introStingScheduled = false;
  const stageImageElements = {};
  let stageSequenceRunning = false;

  document.querySelectorAll('.handle .text, .enter-message').forEach((text) => {
    const content = text.textContent;
    text.textContent = '';

    for (const [index, char] of [...content].entries()) {
      const span = document.createElement('span');
      span.className = 'char';
      span.style.setProperty('--i', index);
      span.textContent = char === ' ' ? '\u00a0' : char;
      text.appendChild(span);
    }
  });

  window.addEventListener('load', () => {
    document.body.classList.add('enter-ready');
  });

  enterScreen.addEventListener('click', () => {
    document.body.classList.add('enter-open');
    document.body.classList.remove('enter-locked');

    document.querySelectorAll('[data-src]').forEach((img) => {
      if (!img.src) img.src = img.dataset.src;
    });

    document.querySelectorAll('.stage-image-stack .stage-image').forEach((img) => {
      stageImageElements[img.dataset.key] = img;
    });
    scheduleStageSequence(8000 + Math.random() * 6000);

    document.querySelectorAll('.lamp .lamp-on').forEach((bulb) => {
      const startBurst = () => {
        const flicks = 1 + Math.floor(Math.random() * 3);
        let step = 0;
        const tick = () => {
          if (step >= flicks * 2) {
            bulb.style.opacity = '0';
            document.body.classList.remove('lamp-lit');
            setTimeout(startBurst, 4000 + Math.random() * 6000);
            return;
          }
          const lit = step % 2 === 0;
          bulb.style.opacity = lit ? '1' : '0';
          document.body.classList.toggle('lamp-lit', lit);
          if (lit) playFlickerSound();
          step++;
          setTimeout(tick, 50 + Math.random() * 130);
        };
        tick();
      };
      setTimeout(startBurst, 1800 + Math.random() * 2400);
    });

    ambientAudio.volume = 0.28;
    ambientAudio.play().catch(() => {});
    fadeInCryingAudio();
    updateMusicProgress();
  }, { once: true });

  function playFlickerSound() {
    const sfx = new Audio(FLICKER_SOUND_SRC);
    sfx.volume = 0.05;
    sfx.play().catch(() => {});
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function transitionStageTo(key) {
    const next = stageImageElements[key];
    if (!next) return;
    Object.values(stageImageElements).forEach((img) => img.classList.remove('active'));
    next.classList.add('active');
    await wait(2500);
  }

  async function runStageSequence() {
    if (stageSequenceRunning) return;
    stageSequenceRunning = true;
    await transitionStageTo('zU');
    await transitionStageTo('ed');
    await wait(5000);
    await transitionStageTo('zU');
    await transitionStageTo('qq');
    stageSequenceRunning = false;
  }

  function scheduleStageSequence(delay = 65000 + Math.random() * 55000) {
    setTimeout(async () => {
      await runStageSequence();
      scheduleStageSequence();
    }, delay);
  }

  function fadeInCryingAudio() {
    const targetVolume = 0.3;
    const fadeMs = 1500;
    const start = performance.now();

    cryingAudio.loop = true;
    cryingAudio.volume = 0;
    try { cryingAudio.currentTime = 0; } catch (_) {}

    const play = () => cryingAudio.play().catch(() => {});

    if (cryingAudio.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
      play();
    } else {
      cryingAudio.load();
      cryingAudio.addEventListener('canplay', play, { once: true });
      play();
    }

    function tick(now) {
      const progress = Math.min(1, (now - start) / fadeMs);
      cryingAudio.volume = targetVolume * progress;

      if (progress < 1) {
        requestAnimationFrame(tick);
        return;
      }

      cryingAudio.volume = targetVolume;
    }

    requestAnimationFrame(tick);
  }

  function clearIntroStingMark() {
    try { localStorage.removeItem(INTRO_STING_KEY); } catch (_) {}
    document.cookie = `${INTRO_STING_KEY}=; Max-Age=0; Path=/; SameSite=Lax`;
    introStingScheduled = false;
  }

  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function updateMusicProgress() {
    const duration = ambientAudio.duration;

    if (Number.isFinite(duration) && duration > 0) {
      const currentTime = ambientAudio.currentTime;

      if (currentTime + 0.5 < lastAudioTime) {
        audioCycleCount++;
      }
      lastAudioTime = currentTime;

      if (currentTime >= 5) {
        scheduleIntroSting();
      }

      const progress = Math.min(1, currentTime / duration);
      const draining = audioCycleCount % 2 === 1;

      if (draining) {
        musicProgressFill.style.transform = `translateX(${progress * 100}%) scaleX(1)`;
      } else {
        musicProgressFill.style.transform = `scaleX(${progress})`;
      }
    }

    progressRaf = window.requestAnimationFrame(updateMusicProgress);
  }

  function hasPlayedIntroSting() {
    try {
      if (localStorage.getItem(INTRO_STING_KEY) === INTRO_STING_VALUE) return true;
    } catch (_) {}

    return document.cookie
      .split(';')
      .some((cookie) => cookie.trim() === `${INTRO_STING_KEY}=${INTRO_STING_VALUE}`);
  }

  function markIntroStingPlayed() {
    try {
      localStorage.setItem(INTRO_STING_KEY, INTRO_STING_VALUE);
    } catch (_) {}

    document.cookie = `${INTRO_STING_KEY}=${INTRO_STING_VALUE}; Max-Age=315360000; Path=/; SameSite=Lax`;
  }

  function scheduleIntroSting() {
    if (introStingScheduled) return;
    introStingScheduled = true;

    if (hasPlayedIntroSting()) return;

    const randomByte = new Uint8Array(1);
    crypto.getRandomValues(randomByte);
    const src = INTRO_STINGS[randomByte[0] % INTRO_STINGS.length];
    const sting = new Audio(src);
    sting.volume = 0.135;
    sting.addEventListener('playing', () => markIntroStingPlayed(), { once: true });
    sting.play().catch(() => {
      introStingScheduled = false;
    });
  }

  handle.addEventListener('click', async (e) => {
    try {
      await navigator.clipboard.writeText(DISCORD_USER);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = DISCORD_USER;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }

    const x = (e.clientX || mouseX);
    const y = (e.clientY || mouseY);
    const note = document.createElement('div');
    note.className = 'copied';
    note.textContent = 'Copied';
    note.style.left = x + 'px';
    note.style.top  = (y - 8) + 'px';
    document.body.appendChild(note);
    note.addEventListener('animationend', () => note.remove());
  });
</script>
</body>
